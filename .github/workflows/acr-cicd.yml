name: CI/CD

# ============================================================
# 混合部署方案（最优）：
#   后端代码 → GitHub Actions 构建镜像 → 推阿里云 ACR（国外网络，apt/pip 快）
#   前端文件 → SCP 直接同步到服务器（nginx 挂载，即时生效）
#   服务器   → 只从 ACR 拉镜像 + 重建容器（阿里云国内快，不本地 build）
# 解决问题：
#   1. 服务器无法访问 GitHub（不 git pull）
#   2. 服务器本地 build 时 apt-get 从 deb.debian.org 下载超时（不 build）
# ============================================================

on:
  push:
    branches: [ main ]

env:
  ACR_NAMESPACE: qianyiaaa
  IMAGE_REPO: mitta

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # ========== 阶段 1：拉取代码 ==========
      - name: Checkout source
        uses: actions/checkout@v4

      # ========== 阶段 2：GitHub Actions 构建后端镜像（国外网络快） ==========
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get commit hash
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build & push api image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # ========== 阶段 3：SCP 同步前端文件 + 配置（绕过 git pull） ==========
      - name: Sync frontend & config to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          # 前端静态文件 + compose 配置 + 运行时配置（.env 不在仓库，不会覆盖）
          source: "resources/frontend,docker-compose.yml,resources/config,resources/system_prompt"
          target: /opt/mitta
          overwrite: true

      # ========== 阶段 4：SSH 部署（只拉镜像，不本地 build） ==========
      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          # 不 build，部署只需拉镜像+重启，10 分钟足够
          command_timeout: 10m
          script: |
            set -e
            cd /opt/mitta

            echo "=== [1/4] 登录 ACR ==="
            docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

            echo "=== [2/4] 拉取最新后端镜像 ==="
            docker compose pull api

            echo "=== [3/4] 重建 api 容器（不 build） ==="
            docker compose up -d --no-build api

            echo "=== [4/4] 健康检查 ==="
            sleep 10
            for i in 1 2 3 4 5 6; do
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              echo "  第 ${i} 次: HTTP $HEALTH"
              if [ "$HEALTH" = "200" ]; then
                echo "✅ 部署成功"
                docker ps --format "table {{.Names}}\t{{.Status}}" | grep mitta
                break
              fi
              if [ "$i" = "6" ]; then
                echo "❌ 健康检查失败，查看日志："
                docker logs mitta-api --tail 30 2>&1
                exit 1
              fi
              sleep 5
            done

            echo "=== 清理悬空镜像 ==="
            docker image prune -f --filter "until=24h"
            echo "=== 部署完成 ==="
