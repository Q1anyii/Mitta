name: ACR-CI-CD

on:
  push:
    branches: [ main ]

env:
  ACR_NAMESPACE: qianyiaaa
  IMAGE_REPO: mitta

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    # GHA 缓存需要 actions:write 权限
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout full source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get git commit short hash
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build & push api image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 适配阿里云 ACR：关闭 provenance 和 sbom，生成 Docker V2 格式
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            APT_MIRROR=deb.debian.org
            PIP_INDEX=https://pypi.org/simple

      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/mitta

            echo "=== [1/5] 同步最新代码（前端/配置/compose） ==="
            # 国内ECS访问GitHub不稳定：强制HTTP/1.1（GnuTLS HTTP/2兼容问题）+ 重试3次
            git config --global http.version HTTP/1.1
            git config --global http.postBuffer 524288000
            for retry in 1 2 3; do
              echo "  git pull 第 ${retry} 次尝试..."
              if git pull origin main; then
                echo "  git pull 成功"
                break
              fi
              if [ "$retry" = "3" ]; then
                echo "❌ git pull 连续3次失败，中止部署"
                exit 1
              fi
              echo "  失败，5秒后重试..."
              sleep 5
            done

            echo "=== [2/5] 登录 ACR 并拉取新镜像 ==="
            docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
            docker compose pull api

            echo "=== [3/5] 记录旧镜像 ID（用于回滚） ==="
            OLD_IMAGE=$(docker inspect --format='{{.Image}}' mitta-api 2>/dev/null || echo "")
            echo "旧容器镜像: $OLD_IMAGE"

            echo "=== [4/5] 重建 api 容器 ==="
            docker compose up -d --no-build api

            echo "=== [5/5] 健康检查（最多等 60 秒） ==="
            for i in $(seq 1 12); do
              sleep 5
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              echo "  第 ${i} 次检查: HTTP $HEALTH"
              if [ "$HEALTH" = "200" ]; then
                echo "✅ 部署成功，服务健康"
                docker logs mitta-api --tail 5 2>&1 | tail -5
                break
              fi
              if [ "$i" = "12" ]; then
                echo "❌ 健康检查失败，回滚到旧镜像..."
                if [ -n "$OLD_IMAGE" ]; then
                  docker stop mitta-api
                  docker rm mitta-api
                  docker run -d --name mitta-api --network mitta_default -p 8000:8000 "$OLD_IMAGE"
                  echo "已回滚到旧镜像: $OLD_IMAGE"
                else
                  echo "无旧镜像可回滚，请手动检查"
                fi
                docker logs mitta-api --tail 30 2>&1
                exit 1
              fi
            done

            echo "=== 清理悬空镜像（保留最近 2 个版本） ==="
            docker image prune -f --filter "until=24h"
            echo "=== 部署完成 ==="
