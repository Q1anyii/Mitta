name: ACR-CI-CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source code
        uses: actions/checkout@v4

      # 服务器连不上 GitHub，用 SCP 把代码直接传到服务器（走SSH 22端口，稳定）
      # 只同步必要文件，排除 .git/.env/缓存等
      - name: Sync code to server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "src,resources/frontend,Dockerfile,docker-compose.yml,requirements.txt,docs,CONTRIBUTING.md,README.md"
          target: "/opt/mitta"
          overwrite: true

      # SSH 到服务器：本地 build 镜像 + 重建容器
      - name: Build & restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/mitta

            echo "=== [1/3] 本地构建镜像 ==="
            docker compose build api

            echo "=== [2/3] 重建 api 容器 ==="
            docker compose up -d --no-deps api

            echo "=== [3/3] 健康检查 ==="
            sleep 10
            for i in 1 2 3 4 5 6; do
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              echo "  第 ${i} 次: HTTP $HEALTH"
              if [ "$HEALTH" = "200" ]; then
                echo "✅ 部署成功"
                docker logs mitta-api --tail 5 2>&1 | tail -5
                break
              fi
              sleep 5
            done

            echo "=== 清理悬空镜像 ==="
            docker image prune -f --filter "until=24h"
            echo "=== 完成 ==="
