name: ACR‑CI‑CD
on:
  push:
    branches: [ main ]
env:
  ACR_NAMESPACE: qianyiaaa
  IMAGE_REPO: mitta
jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get git commit short hash
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Debug show final image tag
        run: |
          echo "IMAGE_TAG=${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}"

      - name: Build & push api image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 适配阿里云ACR：关闭provenance和sbom，生成Docker V2格式
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/mitta
            docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
            export IMG_TAG=${{ env.SHORT_SHA }}
            docker compose pull api
            docker compose up -d --no-build api
            docker image prune -f
