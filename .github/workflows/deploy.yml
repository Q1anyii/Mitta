name: ACR‑CI‑CD
on:
  push:
    branches: [ main ]
env:
  ACR_NAMESPACE: qianyiaaa
  IMAGE_REPO: mitta
jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get git commit short hash
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      # 调试：打印最终完整镜像标签，方便排错
      - name: Debug show final image tag
        run: |
          echo "IMAGE_TAG=${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}"

      - name: Build & push api image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 关键两行：输出Docker V2格式，关闭OCI空manifest，适配阿里云个人ACR
          format: docker
          build-args: |
            DOCKER_BUILDKIT_OCI_EMPTY_MANIFEST=false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/mitta
            export ACR_REGISTRY=${{ secrets.ACR_REGISTRY }}
            export ACR_NAMESPACE=${{ env.ACR_NAMESPACE }}
            export IMAGE_REPO=${{ env.IMAGE_REPO }}
            export IMG_TAG=${{ env.SHORT_SHA }}
            docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
            docker compose pull api
            docker compose up -d
            docker system prune -af
