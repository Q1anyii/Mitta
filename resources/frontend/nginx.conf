# ============================================================
# Nginx 生产配置（conf.d/default.conf 片段，被主 nginx.conf 的 http{} include）
# Mitta AI —— HTTPS / 域名 mittaai.xyz
#   静态根  /usr/share/nginx/html
#   证书    /etc/nginx/ssl/www.mittaai.xyz.pem / .key
#   后端    api:8000（Docker DNS 动态解析，api 重建后无需重启 nginx）
# 80 统一 301 跳 HTTPS
# ============================================================

client_max_body_size 20m;

# Docker 内置 DNS，每 30s 重新解析 api 容器 IP（api 重建后自动跟上）
resolver 127.0.0.11 valid=30s ipv6=off;

# ---- Gzip ----
gzip  on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml text/javascript
           application/javascript application/json application/xml+rss image/svg+xml;

# ===== 80：全部跳 HTTPS =====
server {
    listen 80;
    server_name mittaai.xyz www.mittaai.xyz;
    return 301 https://$host$request_uri;
}

# ===== 443：HTTPS 主站 =====
server {
    listen 443 ssl;
    http2 on;
    server_name mittaai.xyz www.mittaai.xyz;

    ssl_certificate     /etc/nginx/ssl/www.mittaai.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/www.mittaai.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 动态后端地址：用变量 + resolver 实现运行时 DNS 解析，不再启动时写死
    set $api_upstream http://api:8000;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
