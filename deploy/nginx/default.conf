# ============================================================
# Mitta AI — Nginx 服务器配置（生产环境优化版）
#
# 优化项：
#   1. Gzip 压缩（HTML/JS/CSS/JSON/SVG，压缩率 60-70%）
#   2. 静态资源长缓存（图片/字体 30天，带 hash 资源 immutable）
#   3. index.html 短缓存（no-cache，每次协商验证，确保更新即时生效）
#   4. 安全响应头（X-Content-Type-Options, X-Frame-Options 等）
#   5. SSE 流式响应零缓冲（proxy_buffering off）
#   6. upstream keepalive 复用连接，减少 TCP 握手
#
# 部署方式：
#   1. 备份原配置：cp /opt/mitta-nginx/conf.d/default.conf /opt/mitta-nginx/conf.d/default.conf.bak
#   2. 用本文件替换：cp default.conf /opt/mitta-nginx/conf.d/default.conf
#   3. 重载配置：docker exec mitta-nginx nginx -s reload
# ============================================================

# ---- Gzip 压缩（http 块级别，放在 server 块外也可以，但 conf.d 下只能写 server 块）----
# 注意：nginx 容器主配置 /etc/nginx/nginx.conf 已包含 http 块，
# 这里在 server 块内用 gzip on 开启即可。

upstream backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 20m;

    # ============================================================
    # Gzip 压缩
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ============================================================
    # 安全响应头
    # ============================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ============================================================
    # 静态资源长缓存（图片/字体/图标 30天）
    # ============================================================
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================================
    # CSS/JS 协商缓存（no-cache，每次验证 Last-Modified，更新即时生效）
    # 注意：拆分后 css/js 在 assets/ 目录下，无 hash 版本号，
    # 用 no-cache 而非长缓存，避免更新后浏览器用旧缓存
    # ============================================================
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # ============================================================
    # index.html 短缓存（no-cache，每次协商验证，确保更新即时生效）
    # 注意：必须放在 location / 之前，因为更具体的匹配优先
    # ============================================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================================
    # API 代理：/api/* -> FastAPI（SSE 流式零缓冲）
    # ============================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # SSE 流式响应必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;

        # 连接与超时
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 300s;

        # 请求头转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（预留）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # upstream keepalive 需要的头
        proxy_set_header Connection "";
    }

    # ============================================================
    # 健康检查代理
    # ============================================================
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # ============================================================
    # SPA 前端路由：所有非 API/非静态请求返回 index.html
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # 错误页面
    # ============================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
