<html style="margin:0;padding:0;">
<div style="background-color:transparent;box-sizing:border-box;font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif;padding:4px 0;">
  <!-- 标题区 -->
  <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px 2px;">
    <span style="font-size:16px;font-weight:600;color:#1A1B1C;">acr-cicd.yml 完整流程</span>
    <span style="font-size:12px;color:#6B7280;">push → main 触发 · 一条流水线</span>
  </div>

  <!-- 流程图主体（纵向：触发 → 拉码 → 分支 → 构建/跳过 → 同步 → 部署 → 健康检查） -->
  <div style="width:100%;max-width:720px;box-sizing:border-box;">
  <svg viewBox="0 0 760 880" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;" role="img" aria-label="acr-cicd 流程图">
    <!-- ===== 阶段 0：触发 ===== -->
    <rect x="252" y="14" width="216" height="40" rx="20" fill="#1A1B1C"/>
    <text x="360" y="39" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">触发 · push 到 main</text>

    <!-- ===== 阶段 1：拉取代码 ===== -->
    <line x1="360" y1="54" x2="360" y2="80" stroke="#8A93A6" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="196" y="80" width="328" height="50" rx="12" fill="#EAF1FA" stroke="#9BBBF4" stroke-width="1.2"/>
    <text x="360" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1B1C">阶段 1 · 拉取代码</text>
    <text x="360" y="120" text-anchor="middle" font-size="11.5" fill="#6B7280">Checkout source · fetch-depth: 2（拿到 HEAD~1 对比）</text>

    <!-- ===== 阶段 1.5：判断是否重建镜像 ===== -->
    <line x1="360" y1="130" x2="360" y2="158" stroke="#8A93A6" stroke-width="1.6" marker-end="url(#ar)"/>
    <polygon points="360,158 500,196 360,234 220,196" fill="#FFF4E0" stroke="#FAAD14" stroke-width="1.4"/>
    <text x="360" y="190" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B26A00">阶段 1.5 · 需要重建镜像？</text>
    <text x="360" y="207" text-anchor="middle" font-size="11" fill="#8A6A30">Dockerfile / requirements / workflow 有变更</text>

    <!-- 否分支：跳过构建 -->
    <line x1="360" y1="234" x2="360" y2="268" stroke="#8A93A6" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="282" y="268" width="156" height="34" rx="17" fill="#F0F2F5" stroke="#C3CAD6" stroke-width="1.1"/>
    <text x="360" y="290" text-anchor="middle" font-size="12" fill="#5A6472">否 · 复用 latest 镜像</text>

    <!-- 是分支：构建镜像（右侧泳道） -->
    <line x1="500" y1="196" x2="586" y2="196" stroke="#EA6668" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="586" y="150" width="150" height="104" rx="10" fill="#FDF0F0" stroke="#EA6668" stroke-width="1.2"/>
    <text x="661" y="170" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C0392B">阶段 2 · 构建镜像（4 步）</text>
    <line x1="600" y1="182" x2="722" y2="182" stroke="#E8CCCC" stroke-width="1"/>
    <text x="661" y="199" text-anchor="middle" font-size="11" fill="#8A4A45">① Buildx · ② Login ACR</text>
    <text x="661" y="216" text-anchor="middle" font-size="11" fill="#8A4A45">③ 取 SHORT_SHA</text>
    <text x="661" y="233" text-anchor="middle" font-size="11" fill="#8A4A45">④ Build &amp; push 两 tag</text>
    <line x1="661" y1="254" x2="661" y2="286" stroke="#EA6668" stroke-width="1.6" marker-end="url(#ar)"/>
    <line x1="661" y1="286" x2="360" y2="286" stroke="#EA6668" stroke-width="1.6"/>
    <text x="510" y="280" text-anchor="middle" font-size="11" fill="#C0392B">镜像已推送 ACR：sha + latest</text>

    <!-- ===== 阶段 3：SCP 同步（无论是否构建都执行） ===== -->
    <line x1="360" y1="302" x2="360" y2="330" stroke="#8A93A6" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="150" y="330" width="420" height="52" rx="12" fill="#E7F6F1" stroke="#94D8C3" stroke-width="1.2"/>
    <text x="360" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1B1C">阶段 3 · SCP 同步到服务器（始终执行）</text>
    <text x="360" y="370" text-anchor="middle" font-size="11" fill="#5A8268">resources/frontend · compose · config · system_prompt → /opt/mitta</text>

    <!-- ===== 阶段 4：SSH 部署 ===== -->
    <line x1="360" y1="382" x2="360" y2="410" stroke="#8A93A6" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="120" y="410" width="480" height="300" rx="14" fill="#F6F7F9" stroke="#C3CAD6" stroke-width="1.2"/>
    <text x="360" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1B1C">阶段 4 · SSH 部署（4 步）</text>
    <text x="360" y="452" text-anchor="middle" font-size="11" fill="#6B7280">只拉镜像，不本地 build（解决服务器 apt 超时）</text>

    <!-- 4 个部署子步骤 -->
    <rect x="148" y="462" width="424" height="40" rx="9" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="166" y="487" font-size="12" fill="#1A1B1C">① 清理配置残留</text>
    <text x="380" y="487" text-anchor="middle" font-size="11" fill="#6B7280">rm .mcp_config_path / .vector_config_path</text>

    <line x1="360" y1="502" x2="360" y2="512" stroke="#C3CAD6" stroke-width="1.4" marker-end="url(#ar)"/>
    <rect x="148" y="512" width="424" height="40" rx="9" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="166" y="537" font-size="12" fill="#1A1B1C">② 登录 ACR + 拉镜像</text>
    <text x="380" y="537" text-anchor="middle" font-size="11" fill="#6B7280">docker compose pull api</text>

    <line x1="360" y1="552" x2="360" y2="562" stroke="#C3CAD6" stroke-width="1.4" marker-end="url(#ar)"/>
    <rect x="148" y="562" width="424" height="40" rx="9" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="166" y="587" font-size="12" fill="#1A1B1C">③ 重建容器</text>
    <text x="380" y="587" text-anchor="middle" font-size="11" fill="#6B7280">docker compose up -d --no-build api</text>

    <line x1="360" y1="602" x2="360" y2="612" stroke="#C3CAD6" stroke-width="1.4" marker-end="url(#ar)"/>
    <rect x="148" y="612" width="424" height="40" rx="9" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="166" y="637" font-size="12" fill="#1A1B1C">④ 健康检查</text>
    <text x="380" y="637" text-anchor="middle" font-size="11" fill="#6B7280">sleep 10 + curl /health × 8（5s 间隔）</text>

    <!-- ===== 健康检查分支 ===== -->
    <line x1="360" y1="652" x2="360" y2="678" stroke="#8A93A6" stroke-width="1.6" marker-end="url(#ar)"/>
    <polygon points="360,678 480,710 360,742 240,710" fill="#FFF4E0" stroke="#FAAD14" stroke-width="1.4"/>
    <text x="360" y="706" text-anchor="middle" font-size="12" font-weight="600" fill="#B26A00">HTTP 200？</text>
    <text x="360" y="721" text-anchor="middle" font-size="11" fill="#8A6A30">任意一次成功即通过</text>

    <!-- 成功分支 -->
    <line x1="360" y1="742" x2="360" y2="776" stroke="#52C41A" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="206" y="776" width="308" height="46" rx="12" fill="#F0FAEC" stroke="#52C41A" stroke-width="1.2"/>
    <text x="360" y="797" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3A7D1E">✅ 部署成功</text>
    <text x="360" y="813" text-anchor="middle" font-size="11" fill="#5A8268">清理 24h 前悬空镜像 · 打印容器状态</text>

    <!-- 失败分支 -->
    <line x1="480" y1="710" x2="556" y2="710" stroke="#EA6668" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="556" y="678" width="186" height="64" rx="10" fill="#FDF0F0" stroke="#EA6668" stroke-width="1.2"/>
    <text x="649" y="700" text-anchor="middle" font-size="12" font-weight="600" fill="#C0392B">❌ 失败</text>
    <text x="649" y="717" text-anchor="middle" font-size="11" fill="#8A4A45">docker logs --tail 50</text>
    <text x="649" y="732" text-anchor="middle" font-size="11" fill="#8A4A45">→ exit 1</text>

    <!-- 箭头定义 -->
    <defs>
      <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#8A93A6"/>
      </marker>
    </defs>
  </svg>
  </div>

  <!-- 底部说明 -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 2px 0;font-size:12px;color:#6B7280;">
    <span style="padding:4px 10px;border-radius:999px;background:rgba(155,187,244,0.15);">普通代码/前端改动：跳过构建 → ~2-3 分钟</span>
    <span style="padding:4px 10px;border-radius:999px;background:rgba(234,102,104,0.12);">Dockerfile/依赖改动：全量构建 → 8-12 分钟</span>
  </div>
</div>
</html>
