<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 330" width="1260" height="330" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/>
    </marker>
    <marker id="arr2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0B5BD"/>
    </marker>
  </defs>

  <!-- 主链路实线箭头 -->
  <g fill="none" stroke="#8A8F98" stroke-width="1.6" marker-end="url(#arr2)">
    <line x1="95" y1="98" x2="123" y2="98"/>
    <line x1="257" y1="98" x2="263" y2="98"/>
    <line x1="405" y1="98" x2="468" y2="98"/>
    <line x1="670" y1="98" x2="698" y2="98"/>
    <line x1="818" y1="98" x2="846" y2="98"/>
    <line x1="966" y1="98" x2="996" y2="98"/>
    <line x1="925" y1="126" x2="925" y2="208"/>
    <line x1="375" y1="238" x2="413" y2="238"/>
    <path d="M1085,126 V296 H320 V268"/>
  </g>

  <!-- 节点内部扇出：虚线，表示同一个 parallel_retrieve 节点内的线程 -->
  <g fill="none" stroke="#B0B5BD" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr2d)">
    <line x1="570" y1="126" x2="570" y2="144"/>
    <line x1="570" y1="192" x2="570" y2="200"/>
  </g>

  <g font-size="12" fill="#6B7280">
    <text x="437" y="88" text-anchor="middle">No 未命中</text>
    <text x="352" y="182" text-anchor="start">Yes 命中</text>
    <text x="935" y="170" text-anchor="start">旁路写缓存</text>
    <text x="700" y="312" text-anchor="middle">过滤后文档</text>
    <text x="580" y="197" text-anchor="start" font-size="11">等改写结果</text>
  </g>

  <g>
    <rect x="15" y="70" width="80" height="56" rx="16" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
    <text x="55" y="102" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="middle">START</text>

    <rect x="125" y="70" width="130" height="56" rx="10" fill="#F3E8FA" stroke="#9C5BD0" stroke-width="1.6"/>
    <text x="190" y="93" font-size="13" font-weight="600" fill="#5B1E8E" text-anchor="middle">check_cache</text>
    <text x="190" y="112" font-size="11" fill="#8A5BB8" text-anchor="middle">L3a 精确 → L3b 语义</text>

    <polygon points="335,58 405,98 335,138 265,98" fill="#FBF6DF" stroke="#E0B63C" stroke-width="1.6"/>
    <text x="335" y="103" font-size="12.5" font-weight="600" fill="#7A5B00" text-anchor="middle">命中?</text>

    <rect x="470" y="70" width="200" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
    <text x="570" y="93" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">parallel_retrieve</text>
    <text x="570" y="112" font-size="11" fill="#4A6DA8" text-anchor="middle">ThreadPoolExecutor 扇出</text>

    <rect x="700" y="70" width="118" height="56" rx="10" fill="#E4F5EA" stroke="#3DAE5F" stroke-width="1.6"/>
    <text x="759" y="93" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="middle">retrieve</text>
    <text x="759" y="112" font-size="11" fill="#3E8E5A" text-anchor="middle">RRF 融合 k=60</text>

    <rect x="848" y="70" width="118" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
    <text x="907" y="93" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">rerank</text>
    <text x="907" y="112" font-size="11" fill="#4A6DA8" text-anchor="middle">pre_lex 去重 + 精排</text>

    <rect x="998" y="70" width="130" height="56" rx="10" fill="#FBF6DF" stroke="#E0B63C" stroke-width="1.6"/>
    <text x="1063" y="93" font-size="13" font-weight="600" fill="#7A5B00" text-anchor="middle">filter</text>
    <text x="1063" y="112" font-size="11" fill="#A87E1E" text-anchor="middle">阈值 ≥ 0.15</text>
  </g>

  <!-- 并行阶段细节（虚线框 = 同一节点内部，非图节点） -->
  <rect x="470" y="144" width="200" height="48" rx="8" fill="#F5F8FE" stroke="#9BB6E8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="570" y="163" font-size="11" font-weight="600" fill="#2B4E8C" text-anchor="middle">阶段一（并发）</text>
  <text x="570" y="181" font-size="10.5" fill="#4A6DA8" text-anchor="middle">rewrite ∥ dense(原问题) ∥ bm25</text>

  <rect x="470" y="202" width="200" height="48" rx="8" fill="#F5F8FE" stroke="#9BB6E8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="570" y="221" font-size="11" font-weight="600" fill="#2B4E8C" text-anchor="middle">阶段二（并发）</text>
  <text x="570" y="239" font-size="10.5" fill="#4A6DA8" text-anchor="middle">dense(主查询) ∥ dense(子查询…)</text>

  <g>
    <rect x="265" y="212" width="110" height="56" rx="10" fill="#FCE4EC" stroke="#C62828" stroke-width="1.6"/>
    <text x="320" y="235" font-size="13" font-weight="600" fill="#8E1B2E" text-anchor="middle">output_node</text>
    <text x="320" y="254" font-size="11" fill="#B85A6E" text-anchor="middle">返回检索文档</text>

    <rect x="415" y="212" width="80" height="56" rx="16" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
    <text x="455" y="246" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="middle">END</text>

    <rect x="850" y="210" width="150" height="56" rx="10" fill="#F3E8FA" stroke="#9C5BD0" stroke-width="1.6"/>
    <text x="925" y="233" font-size="13" font-weight="600" fill="#5B1E8E" text-anchor="middle">store_cache</text>
    <text x="925" y="252" font-size="11" fill="#8A5BB8" text-anchor="middle">L3a + L3b 双写</text>
  </g>
</svg>
