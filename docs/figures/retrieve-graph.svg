<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrHit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/>
    </marker>
  </defs>
  <rect x="20" y="180" width="90" height="44" rx="22" fill="#eef2f7" stroke="#9aa7b5" stroke-width="1.5"/>
  <text x="65" y="207" text-anchor="middle" font-size="14" fill="#334155" font-weight="600">START</text>
  <rect x="150" y="170" width="130" height="64" rx="10" fill="#fff7e6" stroke="#e8a33d" stroke-width="1.8"/>
  <text x="215" y="197" text-anchor="middle" font-size="14" fill="#7a4f12" font-weight="600">check_cache</text>
  <text x="215" y="217" text-anchor="middle" font-size="11" fill="#9a6b22">L3a 精确 / L3b 语义</text>
  <rect x="330" y="170" width="150" height="64" rx="10" fill="#e8f1fb" stroke="#3b82c4" stroke-width="1.8"/>
  <text x="405" y="197" text-anchor="middle" font-size="14" fill="#1e4a7a" font-weight="600">parallel_retrieve</text>
  <text x="405" y="217" text-anchor="middle" font-size="11" fill="#3b6fa0">rewrite ∥ dense ∥ bm25</text>
  <rect x="530" y="170" width="110" height="64" rx="10" fill="#e8f1fb" stroke="#3b82c4" stroke-width="1.8"/>
  <text x="585" y="197" text-anchor="middle" font-size="14" fill="#1e4a7a" font-weight="600">retrieve</text>
  <text x="585" y="217" text-anchor="middle" font-size="11" fill="#3b6fa0">RRF 融合</text>
  <rect x="690" y="170" width="100" height="64" rx="10" fill="#e8f1fb" stroke="#3b82c4" stroke-width="1.8"/>
  <text x="740" y="197" text-anchor="middle" font-size="14" fill="#1e4a7a" font-weight="600">rerank</text>
  <text x="740" y="217" text-anchor="middle" font-size="11" fill="#3b6fa0">bge-reranker</text>
  <rect x="850" y="80" width="130" height="56" rx="10" fill="#f0e8fb" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="915" y="105" text-anchor="middle" font-size="13" fill="#4c1d95" font-weight="600">store_cache</text>
  <text x="915" y="123" text-anchor="middle" font-size="11" fill="#6d28d9">写 L3 缓存</text>
  <rect x="850" y="250" width="130" height="64" rx="10" fill="#e6f7ee" stroke="#22a06b" stroke-width="1.8"/>
  <text x="915" y="277" text-anchor="middle" font-size="14" fill="#0f5132" font-weight="600">filter</text>
  <text x="915" y="297" text-anchor="middle" font-size="11" fill="#1f7a4d">阈值 0.15 / MMR</text>
  <rect x="1010" y="250" width="70" height="64" rx="10" fill="#eef2f7" stroke="#9aa7b5" stroke-width="1.8"/>
  <text x="1045" y="277" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">output</text>
  <text x="1045" y="297" text-anchor="middle" font-size="11" fill="#64748b">END</text>
  <line x1="110" y1="202" x2="148" y2="202" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="280" y1="202" x2="328" y2="202" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="304" y="192" text-anchor="middle" font-size="11" fill="#64748b">miss</text>
  <line x1="480" y1="202" x2="528" y2="202" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="640" y1="202" x2="688" y2="202" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M790,190 C820,190 820,108 848,108" fill="none" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="818" y="130" font-size="11" fill="#6d28d9">并行</text>
  <path d="M790,214 C820,214 820,282 848,282" fill="none" stroke="#22a06b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="980" y1="282" x2="1008" y2="282" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M215,234 L215,360 L915,360 L915,316" fill="none" stroke="#3b82c4" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrHit)"/>
  <text x="565" y="352" text-anchor="middle" font-size="12" fill="#1e4a7a" font-weight="600">hit（缓存命中，跳过检索/重排，直接到 filter）</text>
  <text x="550" y="30" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">Mitta RAG 检索子图（retrieve_graph）</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#64748b">默认并行模式 · 缓存命中直达 filter · rerank 后 store_cache 与 filter 并行</text>
</svg>