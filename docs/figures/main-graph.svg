<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" width="1180" height="380" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0B5BD"/>
    </marker>
  </defs>

  <!-- 主线（上排水平） -->
  <g fill="none" stroke="#8A8F98" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="100" y1="98" x2="120" y2="98"/>
    <line x1="300" y1="98" x2="335" y2="98"/>
    <line x1="445" y1="98" x2="470" y2="98"/>
    <line x1="670" y1="98" x2="700" y2="98"/>
    <line x1="810" y1="98" x2="840" y2="98"/>
    <line x1="1010" y1="98" x2="1040" y2="98"/>
  </g>

  <!-- 分支垂直下落 -->
  <g fill="none" stroke="#8A8F98" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="390" y1="136" x2="390" y2="220"/>
    <line x1="755" y1="136" x2="755" y2="220"/>
  </g>

  <!-- 回传：retrieve 走 llm 左下端，水平段只到 x=500 -->
  <path d="M390,276 L390,300 L500,300 L500,126" fill="none" stroke="#9C5BD0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
  <!-- 回传：tool 走 llm 右下端，水平段只从 x=640 起 -->
  <path d="M755,276 L755,320 L640,320 L640,126" fill="none" stroke="#E08A3C" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrD)"/>

  <!-- chibi 旁路 -->
  <line x1="925" y1="126" x2="925" y2="220" stroke="#C62828" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrD)"/>

  <!-- 标签 -->
  <g font-size="11.5" fill="#6B7280" text-anchor="middle">
    <text x="458" y="88">No</text>
    <text x="398" y="180">Yes 走检索</text>
    <text x="825" y="88">No 收尾</text>
    <text x="763" y="180">Yes 调用工具</text>
    <text x="445" y="294" fill="#7A4BA8">RAG 结果回传</text>
    <text x="697" y="314" fill="#B8742E">工具结果回传</text>
    <text x="933" y="180" fill="#B85A6E">30% 概率·异步</text>
    <text x="248" y="252" font-size="10.5" fill="#9AA0A8">进子图前 SSE 推 ack</text>
  </g>

  <!-- 上排节点 -->
  <rect x="20" y="70" width="80" height="56" rx="16" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
  <text x="60" y="103" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="middle">START</text>

  <rect x="120" y="70" width="180" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
  <text x="210" y="93" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">router_node</text>
  <text x="210" y="112" font-size="11" fill="#4A6DA8" text-anchor="middle">一次 LLM：persona + need_retrieval</text>

  <polygon points="390,60 445,98 390,136 335,98" fill="#FBF6DF" stroke="#E0B63C" stroke-width="1.6"/>
  <text x="390" y="102" font-size="12" font-weight="600" fill="#7A5B00" text-anchor="middle">needs_retrieval?</text>

  <rect x="470" y="70" width="200" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
  <text x="570" y="92" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">llm_node</text>
  <text x="570" y="110" font-size="11" fill="#4A6DA8" text-anchor="middle">System Prompt + 人格白名单 + 流式</text>

  <polygon points="755,60 810,98 755,136 700,98" fill="#FBF6DF" stroke="#E0B63C" stroke-width="1.6"/>
  <text x="755" y="102" font-size="12" font-weight="600" fill="#7A5B00" text-anchor="middle">tool_calls?</text>

  <rect x="840" y="70" width="170" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
  <text x="925" y="92" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">memory_node</text>
  <text x="925" y="110" font-size="11" fill="#4A6DA8" text-anchor="middle">fire-and-forget · done 先行</text>

  <rect x="1040" y="70" width="80" height="56" rx="16" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
  <text x="1080" y="103" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="middle">END</text>

  <!-- 下排分支 -->
  <rect x="320" y="220" width="140" height="56" rx="10" fill="#F3E8FA" stroke="#9C5BD0" stroke-width="1.6"/>
  <text x="390" y="243" font-size="13" font-weight="600" fill="#5B1E8E" text-anchor="middle">retrieve_node</text>
  <text x="390" y="261" font-size="11" fill="#8A5BB8" text-anchor="middle">RAG 子图（四层缓存+并行）</text>

  <rect x="690" y="220" width="130" height="56" rx="10" fill="#FEF0E4" stroke="#E08A3C" stroke-width="1.6"/>
  <text x="755" y="243" font-size="13" font-weight="600" fill="#8E4A00" text-anchor="middle">tool_node</text>
  <text x="755" y="261" font-size="11" fill="#B8742E" text-anchor="middle">执行 MCP 工具</text>

  <rect x="880" y="220" width="130" height="56" rx="10" fill="#FCE4EC" stroke="#C62828" stroke-width="1.6"/>
  <text x="945" y="243" font-size="12.5" font-weight="600" fill="#8E1B2E" text-anchor="middle">chibi hook</text>
  <text x="945" y="261" font-size="11" fill="#B85A6E" text-anchor="middle">后台线程（30%）</text>
</svg>