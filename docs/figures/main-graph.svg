<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/>
    </marker>
    <marker id="arr1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0B5BD"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8A8F98" stroke-width="1.6" marker-end="url(#arr1)">
    <line x1="105" y1="88" x2="135" y2="88"/>
    <line x1="300" y1="88" x2="345" y2="88"/>
    <line x1="500" y1="88" x2="545" y2="88"/>
    <line x1="760" y1="88" x2="815" y2="88"/>
    <line x1="1030" y1="88" x2="1085" y2="88"/>
  </g>
  <g fill="none" stroke="#8A8F98" stroke-width="1.6" marker-end="url(#arr1)">
    <line x1="420" y1="128" x2="392" y2="235"/>
    <line x1="925" y1="128" x2="900" y2="235"/>
    <path d="M785,243 C735,243 720,170 690,128"/>
    <path d="M1145,243 C1195,243 1215,170 1245,128"/>
  </g>
  <g fill="none" stroke="#B0B5BD" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr1d)">
    <line x1="370" y1="235" x2="250" y2="235"/>
  </g>
  <g font-size="12" fill="#6B7280" text-anchor="middle">
    <text x="322" y="178">Yes 走检索</text>
    <text x="560" y="78">No 直接生成</text>
    <text x="706" y="176">Yes 调用工具</text>
    <text x="986" y="78">No 收尾</text>
    <text x="1015" y="222">工具结果回传</text>
    <text x="1200" y="222">chibi 异步吐槽</text>
    <text x="310" y="300" text-anchor="middle" font-size="11">检索前 ack 预响应（custom 通道推开场白）</text>
  </g>
  <g>
    <rect x="15" y="60" width="90" height="56" rx="16" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
    <text x="60" y="94" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="middle">START</text>

    <rect x="135" y="60" width="165" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
    <text x="217" y="83" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">router_node</text>
    <text x="217" y="102" font-size="11" fill="#4A6DA8" text-anchor="middle">一次 LLM：persona + need_retrieval</text>

    <polygon points="420,48 500,88 420,128 345,88" fill="#FBF6DF" stroke="#E0B63C" stroke-width="1.6"/>
    <text x="420" y="93" font-size="12.5" font-weight="600" fill="#7A5B00" text-anchor="middle">needs_retrieval?</text>

    <rect x="545" y="60" width="215" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
    <text x="652" y="80" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">llm_node</text>
    <text x="652" y="98" font-size="11" fill="#4A6DA8" text-anchor="middle">System Prompt + 人格白名单</text>
    <text x="652" y="114" font-size="11" fill="#4A6DA8" text-anchor="middle">ToolFilter 筛工具 + 流式生成</text>

    <polygon points="925,48 1005,88 925,128 845,88" fill="#FBF6DF" stroke="#E0B63C" stroke-width="1.6"/>
    <text x="925" y="93" font-size="12.5" font-weight="600" fill="#7A5B00" text-anchor="middle">tool_calls?</text>

    <rect x="1085" y="60" width="160" height="56" rx="10" fill="#E8EFFC" stroke="#5B8DEF" stroke-width="1.6"/>
    <text x="1165" y="80" font-size="13" font-weight="600" fill="#1A3C7E" text-anchor="middle">memory_node</text>
    <text x="1165" y="98" font-size="11" fill="#4A6DA8" text-anchor="middle">daemon 线程 fire-and-forget</text>
    <text x="1165" y="114" font-size="11" fill="#4A6DA8" text-anchor="middle">节点立即返回 · done 先行</text>

    <rect x="1245" y="60" width="20" height="56" rx="16" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
    <text x="1255" y="94" font-size="11" font-weight="600" fill="#1B5E20" text-anchor="middle">END</text>
  </g>
  <g>
    <rect x="250" y="212" width="142" height="56" rx="10" fill="#F3E8FA" stroke="#9C5BD0" stroke-width="1.6"/>
    <text x="321" y="233" font-size="13" font-weight="600" fill="#5B1E8E" text-anchor="middle">retrieve_node</text>
    <text x="321" y="252" font-size="11" fill="#8A5BB8" text-anchor="middle">RAG 子图（四层缓存+并行）</text>

    <rect x="900" y="212" width="120" height="56" rx="10" fill="#FEF0E4" stroke="#E08A3C" stroke-width="1.6"/>
    <text x="960" y="233" font-size="13" font-weight="600" fill="#8E4A00" text-anchor="middle">tool_node</text>
    <text x="960" y="252" font-size="11" fill="#B8742E" text-anchor="middle">执行 MCP 工具</text>

    <rect x="1145" y="212" width="110" height="56" rx="10" fill="#FCE4EC" stroke="#C62828" stroke-width="1.6"/>
    <text x="1200" y="233" font-size="12.5" font-weight="600" fill="#8E1B2E" text-anchor="middle">chibi hook</text>
    <text x="1200" y="252" font-size="11" fill="#B85A6E" text-anchor="middle">后台线程（30% 概率）</text>
  </g>
