  <!-- MCP 客户端 -->
  <rect x="42" y="714" width="876" height="92" rx="8" fill="#FFFFFF" stroke="rgba(201,167,232,0.5)" stroke-width="1"/>
  <text x="54" y="733" font-size="12.5" font-weight="700" fill="#1A1B1C">MCP 客户端（常驻 mcp-tool-loop 事件循环）</text>
  <text x="54" y="751" font-size="11" fill="#4B5563">run_coroutine_threadsafe 跨线程调用 · make_sync_tool 30s 超时 → 错误转消息不中断 · 单机故障降级跳过 · 连接超时 120s（冷启动下载依赖）</text>
  <text x="54" y="769" font-size="11" fill="#4B5563">内置 8 台服务器（mcp_servers.json）：filesystem / fetch / sqlite / sequential-thinking / memory / time / context7 / dbhub</text>
  <text x="54" y="787" font-size="11" fill="#4B5563">用户级配置存 PG 按 user_id 隔离 · config_hash MD5 检测热重载 · POST /api/mcp/reload 主动清缓存</text>

