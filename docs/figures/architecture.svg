<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1230" viewBox="0 0 960 1230" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <title>Mitta 整体架构图</title>

  <!-- 标题与图例 -->
  <text x="24" y="30" font-size="22" font-weight="700" fill="#1A1B1C">Mitta · 整体架构图</text>
  <line x1="24" y1="44" x2="936" y2="44" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <text x="24" y="66" font-size="12" fill="#6B7280">图例：</text>
  <rect x="66" y="54" width="14" height="14" rx="3" fill="#94D4D0" opacity="0.45"/>
  <text x="84" y="66" font-size="12" fill="#6B7280">分层模块</text>
  <text x="164" y="66" font-size="12" fill="#8BC8EA" font-weight="700">▼</text>
  <text x="180" y="66" font-size="12" fill="#6B7280">请求/数据流向</text>
  <text x="300" y="66" font-size="12" fill="#EA6668" font-weight="700">⚠</text>
  <text x="316" y="66" font-size="12" fill="#6B7280">规划中未实现</text>

  <!-- L1 客户端 -->
  <rect x="24" y="80" width="912" height="80" rx="10" fill="rgba(148,212,208,0.10)"/>
  <rect x="24" y="80" width="6" height="80" rx="3" fill="#94D4D0"/>
  <text x="42" y="100" font-size="14" font-weight="700" fill="#1A1B1C">L1 · 客户端层</text>
  <rect x="42" y="108" width="430" height="44" rx="8" fill="#FFFFFF" stroke="rgba(148,212,208,0.6)"/>
  <text x="54" y="127" font-size="13" font-weight="700" fill="#1A1B1C">🌐 浏览器 SPA</text>
  <text x="54" y="143" font-size="11" fill="#4B5563">Vue 3 · SSE 打字机 · 多主题 · 刷新续传</text>
  <rect x="488" y="108" width="430" height="44" rx="8" fill="#FFFFFF" stroke="rgba(148,212,208,0.6)"/>
  <text x="500" y="127" font-size="13" font-weight="700" fill="#1A1B1C">🖥️ Tauri 桌面端（Rust 壳）</text>
  <text x="500" y="143" font-size="11" fill="#4B5563">WebView2 · 自定义标题栏 · API = mittaai.xyz</text>

  <text x="480" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#8BC8EA">▼ HTTPS / SSE（80→301→443）</text>

  <!-- L2 接入层 -->
  <rect x="24" y="186" width="912" height="54" rx="10" fill="rgba(158,172,234,0.10)"/>
  <rect x="24" y="186" width="6" height="54" rx="3" fill="#9EACEA"/>
  <text x="42" y="206" font-size="14" font-weight="700" fill="#1A1B1C">L2 · 接入层</text>
  <rect x="42" y="212" width="876" height="24" rx="8" fill="#FFFFFF" stroke="rgba(158,172,234,0.6)"/>
  <text x="54" y="229" font-size="12.5" font-weight="700" fill="#1A1B1C">🔀 Nginx 1.27</text>
  <text x="150" y="229" font-size="11" fill="#4B5563">静态托管 · /api 反代 :8000 · HTTPS · SSE 关闭缓冲</text>

  <text x="480" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#8BC8EA">▼ /api/*（JSON + SSE）</text>

  <!-- L3 应用层 -->
  <rect x="24" y="266" width="912" height="140" rx="10" fill="rgba(139,200,234,0.10)"/>
  <rect x="24" y="266" width="6" height="140" rx="3" fill="#8BC8EA"/>
  <text x="42" y="286" font-size="14" font-weight="700" fill="#1A1B1C">L3 · 应用层（FastAPI :8000）</text>
  <rect x="42" y="296" width="288" height="98" rx="8" fill="#FFFFFF" stroke="rgba(139,200,234,0.5)"/>
  <text x="54" y="315" font-size="12.5" font-weight="700" fill="#1A1B1C">中间件 / 认证</text>
  <text x="54" y="333" font-size="11" fill="#4B5563">限流 60s·30次/IP（Redis→内存降级）</text>
  <text x="54" y="350" font-size="11" fill="#4B5563">JWT 双令牌（15min + 30d 隐式续签）</text>
  <text x="54" y="367" font-size="11" fill="#4B5563">bcrypt · 登出即失效</text>
  <rect x="342" y="296" width="288" height="98" rx="8" fill="#FFFFFF" stroke="rgba(139,200,234,0.5)"/>
  <text x="354" y="315" font-size="12.5" font-weight="700" fill="#1A1B1C">路由（6 组）</text>
  <text x="354" y="333" font-size="11" fill="#4B5563">auth / chat / user / knowledge / mcp / system</text>
  <text x="354" y="350" font-size="11" fill="#4B5563">system_router 兜底最后注册</text>
  <text x="354" y="367" font-size="11" fill="#4B5563">会话归属校验（非本人 thread_id → 403）</text>
  <rect x="642" y="296" width="276" height="98" rx="8" fill="#FFFFFF" stroke="rgba(139,200,234,0.5)"/>
  <text x="654" y="315" font-size="12.5" font-weight="700" fill="#1A1B1C">服务层（chat_service）</text>
  <text x="654" y="333" font-size="11" fill="#4B5563">用户级图缓存（config_hash 热重载）</text>
  <text x="654" y="350" font-size="11" fill="#4B5563">SSE 事件落 Redis · 断点续传 after=N</text>
  <text x="654" y="367" font-size="11" fill="#4B5563">文件解析缓存 · MCP 配置按用户隔离</text>

  <text x="480" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#8BC8EA">▼ 图编译缓存（_user_graph_cache）</text>

  <!-- L4 Agent 层 -->
  <rect x="24" y="432" width="912" height="300" rx="10" fill="rgba(201,167,232,0.10)"/>
  <rect x="24" y="432" width="6" height="300" rx="3" fill="#C9A7E8"/>
  <text x="42" y="452" font-size="14" font-weight="700" fill="#1A1B1C">L4 · Agent 编排层（LangGraph 1.x，双图）</text>

  <!-- 主图概要 -->
  <rect x="42" y="462" width="876" height="92" rx="8" fill="#FFFFFF" stroke="rgba(201,167,232,0.5)"/>
  <text x="54" y="481" font-size="12.5" font-weight="700" fill="#1A1B1C">主对话图 main_graph（StateGraph + 统一路由 + Checkpointer）</text>
  <g font-size="11.5" font-weight="600" fill="#1A1B1C" text-anchor="middle">
    <rect x="54" y="492" width="130" height="44" rx="7" fill="#F7F2FC" stroke="rgba(201,167,232,0.6)"/>
    <text x="119" y="511">router_node</text>
    <text x="119" y="527" font-size="10" font-weight="400" fill="#6B7280">persona + need_retrieval</text>
    <text x="198" y="516" font-size="11" fill="#C9A7E8">→</text>
    <rect x="210" y="492" width="130" height="44" rx="7" fill="#F7F2FC" stroke="rgba(201,167,232,0.6)"/>
    <text x="275" y="511">retrieve_node</text>
    <text x="275" y="527" font-size="10" font-weight="400" fill="#6B7280">RAG 子图</text>
    <text x="354" y="516" font-size="11" fill="#C9A7E8">→</text>
    <rect x="366" y="492" width="160" height="44" rx="7" fill="#F7F2FC" stroke="rgba(201,167,232,0.6)"/>
    <text x="446" y="511">llm_node</text>
    <text x="446" y="527" font-size="10" font-weight="400" fill="#6B7280">ToolFilter + 流式生成</text>
    <text x="536" y="516" font-size="11" fill="#C9A7E8">↻</text>
    <rect x="548" y="492" width="120" height="44" rx="7" fill="#F7F2FC" stroke="rgba(201,167,232,0.6)"/>
    <text x="608" y="511">tool_node</text>
    <text x="608" y="527" font-size="10" font-weight="400" fill="#6B7280">MCP 执行</text>
    <text x="678" y="516" font-size="11" fill="#C9A7E8">→</text>
    <rect x="690" y="492" width="160" height="44" rx="7" fill="#F7F2FC" stroke="rgba(201,167,232,0.6)"/>
    <text x="770" y="511">memory_node</text>
    <text x="770" y="527" font-size="10" font-weight="400" fill="#6B7280">fire-and-forget</text>
  </g>

  <!-- RAG 子图概要 -->
  <rect x="42" y="562" width="876" height="76" rx="8" fill="#FFFFFF" stroke="rgba(201,167,232,0.5)"/>
  <text x="54" y="581" font-size="12.5" font-weight="700" fill="#1A1B1C">RAG 检索子图 retrieve_graph（并行编排 + 四层缓存）</text>
  <g font-size="11" font-weight="600" fill="#1A1B1C" text-anchor="middle">
    <rect x="54" y="590" width="120" height="38" rx="6" fill="#F7F2FC" stroke="rgba(201,167,232,0.55)"/>
    <text x="114" y="606">check_cache</text>
    <text x="114" y="620" font-size="9.5" font-weight="400" fill="#6B7280">L3a→L3b</text>
    <text x="184" y="611" font-size="10.5" fill="#C9A7E8">→</text>
    <rect x="196" y="590" width="170" height="38" rx="6" fill="#F7F2FC" stroke="rgba(201,167,232,0.55)"/>
    <text x="281" y="606">parallel_retrieve</text>
    <text x="281" y="620" font-size="9.5" font-weight="400" fill="#6B7280">改写∥dense∥bm25 并发</text>
    <text x="376" y="611" font-size="10.5" fill="#C9A7E8">→</text>
    <rect x="388" y="590" width="100" height="38" rx="6" fill="#F7F2FC" stroke="rgba(201,167,232,0.55)"/>
    <text x="438" y="606">retrieve</text>
    <text x="438" y="620" font-size="9.5" font-weight="400" fill="#6B7280">RRF k=60</text>
    <text x="498" y="611" font-size="10.5" fill="#C9A7E8">→</text>
    <rect x="510" y="590" width="110" height="38" rx="6" fill="#F7F2FC" stroke="rgba(201,167,232,0.55)"/>
    <text x="565" y="606">rerank</text>
    <text x="565" y="620" font-size="9.5" font-weight="400" fill="#6B7280">pre_lex+bge 精排</text>
    <text x="630" y="611" font-size="10.5" fill="#C9A7E8">→</text>
    <rect x="642" y="590" width="90" height="38" rx="6" fill="#F7F2FC" stroke="rgba(201,167,232,0.55)"/>
    <text x="687" y="606">filter</text>
    <text x="687" y="620" font-size="9.5" font-weight="400" fill="#6B7280">阈值 0.15</text>
    <text x="742" y="611" font-size="10.5" fill="#C9A7E8">→</text>
    <rect x="754" y="590" width="110" height="38" rx="6" fill="#F7F2FC" stroke="rgba(201,167,232,0.55)"/>
    <text x="809" y="606">store_cache</text>
    <text x="809" y="620" font-size="9.5" font-weight="400" fill="#6B7280">L3a+L3b 双写</text>
  </g>

  <!-- MCP 客户端 -->
  <rect x="42" y="646" width="876" height="74" rx="8" fill="#FFFFFF" stroke="rgba(201,167,232,0.5)"/>
  <text x="54" y="665" font-size="12.5" font-weight="700" fill="#1A1B1C">MCP 客户端（常驻事件循环 · 30s 超时转错误消息）</text>
  <text x="54" y="683" font-size="11" fill="#4B5563">内置 8 台：filesystem / sqlite / sequential-thinking / memory / time / context7 / dbhub / mittatools</text>
  <text x="54" y="701" font-size="11" fill="#4B5563">用户级配置存 PG 按 user_id 隔离 · config_hash 热重载 · 单机故障降级跳过</text>

  <text x="480" y="752" text-anchor="middle" font-size="12" font-weight="700" fill="#8BC8EA">▼ Checkpointer / Store / 缓存 / 向量检索 / MCP 子进程</text>

  <!-- L5 基础设施 -->
  <rect x="24" y="762" width="912" height="206" rx="10" fill="rgba(162,221,170,0.10)"/>
  <rect x="24" y="762" width="6" height="206" rx="3" fill="#A2DDAA"/>
  <text x="42" y="782" font-size="14" font-weight="700" fill="#1A1B1C">L5 · 数据与基础设施层</text>
  <rect x="42" y="792" width="214" height="164" rx="8" fill="#FFFFFF" stroke="rgba(162,221,170,0.55)"/>
  <text x="54" y="811" font-size="12.5" font-weight="700" fill="#1A1B1C">PostgreSQL 16</text>
  <text x="54" y="830" font-size="11" fill="#4B5563">Checkpointer（短期记忆）</text>
  <text x="62" y="845" font-size="10.5" fill="#6B7280">thread_id 会话级恢复</text>
  <text x="54" y="863" font-size="11" fill="#4B5563">Store（长期记忆）</text>
  <text x="62" y="878" font-size="10.5" fill="#6B7280">user_id 跨会话持久</text>
  <text x="54" y="896" font-size="11" fill="#4B5563">用户表 / 文件 / MCP 配置</text>
  <rect x="268" y="792" width="214" height="164" rx="8" fill="#FFFFFF" stroke="rgba(162,221,170,0.55)"/>
  <text x="280" y="811" font-size="12.5" font-weight="700" fill="#1A1B1C">Redis 7（redis-stack）</text>
  <text x="280" y="830" font-size="11" fill="#4B5563">节点级缓存 · LSH 检索缓存</text>
  <text x="280" y="848" font-size="11" fill="#4B5563">RedisSearch BM25</text>
  <text x="280" y="866" font-size="11" fill="#4B5563">JWT 登录态 · 限流计数</text>
  <text x="280" y="884" font-size="11" fill="#4B5563">SSE 事件流（TTL 7 天）</text>
  <rect x="494" y="792" width="214" height="164" rx="8" fill="#FFFFFF" stroke="rgba(162,221,170,0.55)"/>
  <text x="506" y="811" font-size="12.5" font-weight="700" fill="#1A1B1C">向量库（可插拔）</text>
  <text x="506" y="830" font-size="11" fill="#4B5563">ChromaDB 默认</text>
  <text x="514" y="845" font-size="10.5" fill="#6B7280">免部署 · 低配机适用</text>
  <text x="506" y="863" font-size="11" fill="#4B5563">Milvus 可切换</text>
  <text x="514" y="878" font-size="10.5" fill="#6B7280">Protocol 抽象零改动</text>
  <text x="506" y="896" font-size="11" fill="#4B5563">集合：FAQ / MCP_TOOLS</text>
  <rect x="720" y="792" width="198" height="164" rx="8" fill="#FFFFFF" stroke="rgba(162,221,170,0.55)"/>
  <text x="732" y="811" font-size="12.5" font-weight="700" fill="#1A1B1C">知识库</text>
  <text x="732" y="830" font-size="11" fill="#4B5563">knowledge-base 01~20</text>
  <text x="740" y="845" font-size="10.5" fill="#6B7280">分类 md 编程知识</text>
  <text x="732" y="863" font-size="11" fill="#4B5563">ingest 双写向量+BM25</text>
  <text x="732" y="881" font-size="11" fill="#4B5563">test-qa 50 条 QA 评测集</text>

  <text x="480" y="986" text-anchor="middle" font-size="12" font-weight="700" fill="#F4B393">▼ LLM / Embedding / Rerank</text>

  <!-- L6 外部 AI -->
  <rect x="24" y="996" width="912" height="88" rx="10" fill="rgba(244,179,147,0.10)"/>
  <rect x="24" y="996" width="6" height="88" rx="3" fill="#F4B393"/>
  <text x="42" y="1016" font-size="14" font-weight="700" fill="#1A1B1C">L6 · 外部 AI 服务</text>
  <rect x="42" y="1026" width="288" height="48" rx="8" fill="#FFFFFF" stroke="rgba(244,179,147,0.55)"/>
  <text x="54" y="1045" font-size="12.5" font-weight="700" fill="#1A1B1C">DeepSeek</text>
  <text x="54" y="1061" font-size="11" fill="#4B5563">分类 / 改写 / 生成 / 记忆提取 · reasoning</text>
  <rect x="342" y="1026" width="288" height="48" rx="8" fill="#FFFFFF" stroke="rgba(244,179,147,0.55)"/>
  <text x="354" y="1045" font-size="12.5" font-weight="700" fill="#1A1B1C">SiliconFlow</text>
  <text x="354" y="1061" font-size="11" fill="#4B5563">bge-m3 Embedding · bge-reranker-v2-m3</text>
  <rect x="642" y="1026" width="276" height="48" rx="8" fill="#FFFFFF" stroke="rgba(244,179,147,0.55)"/>
  <text x="654" y="1045" font-size="12.5" font-weight="700" fill="#1A1B1C">可选</text>
  <text x="654" y="1061" font-size="11" fill="#4B5563">LangSmith 追踪（开关）· 备用 key 预留</text>

  <!-- CI/CD -->
  <rect x="24" y="1100" width="912" height="66" rx="10" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.10)"/>
  <text x="42" y="1121" font-size="13" font-weight="700" fill="#1A1B1C">CI/CD（GitHub Actions → ACR → ECS rsync → docker compose up）</text>
  <text x="42" y="1141" font-size="11" fill="#4B5563">git push main → 构建（git diff 跳过重建）→ 阿里云 ACR → ECS rsync -azc 增量 → pull/up --no-build → /health 探活</text>

  <!-- 脚注 -->
  <text x="24" y="1192" font-size="11" fill="#6B7280">⚠ 按代码核对：RAG 过滤阈值 0.15 · 内置 MCP 8 台 · 容器 Python 3.12-slim · 断点续传自研 after=seq 协议</text>
  <text x="24" y="1210" font-size="11" fill="#EA6668">⚠ 规划中未实现：五人格多 Agent、Supervisor 升级（仅方案文档，无代码）</text>
</svg>